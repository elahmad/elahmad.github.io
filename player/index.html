
<html>
<head>
  <title>elahmad M3U8 & MPD Player</title>
  <style type="text/css">body{margin:0 auto;}</style>
<meta name="referrer" content="no-referrer" />
</head>
<body bgcolor='black' style='margin:0'>
<div id="player"></div>
<script>
function loadScripts(a, d) {
    var e = function(f, g) {
        var h = document.createElement("script");
        h.src = f;
        h.charset = "UTF-8";
        h.onload = h.onreadystatechange = function() {
            h.onreadystatechange = h.onload = null;
            g()
        };
        (document.getElementsByTagName("script")[0] || document.getElementsByTagName("head")[0] || document.body).appendChild(h)
    };
    (function g() {
        0 != a.length ? e(a.shift(), g) : d && d()
    })()
}

function getType(a) {
    var c = /^rtmp:\/\//,
        d = /\.(php|m3u8)/i,
        e = /\.(mp4|m4p|m4v|mov)/i,
        f = /\.f4m/,
        g = /\.mpd/,
        l = /\.flv/,
        k = /\.webm|.mkv/,
        h = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&\?]*).;*/,
        n = /\.?dailymotion.com/,
        m = /\.?vimeo.com/,
        p = /\.ogg/;
    return /\.(mp3|m4a)/i.test(a) ? "audio/mpeg" :
        c.test(a) ? "rtmp/mp4" :
        d.test(a) ? "application/x-mpegURL" :
        e.test(a) ? "video/mp4" :
        f.test(a) ? "application/adobe-f4m" :
        g.test(a) ? "application/dash+xml" :
        l.test(a) ? "video/flv" :
        k.test(a) ? "video/webm" :
        p.test(a) ? "video/ogg" :
        h.test(a) ? "video/youtube" :
        n.test(a) ? "video/dailymotion" :
        m.test(a) ? "video/vimeo" :
        "application/x-mpegURL";
}

function playWithClappr(a) {
    loadScripts([
        "https://cdn.jsdelivr.net/npm/@clappr/player@0.14.3/dist/clappr.min.js",
        "https://cdn.jsdelivr.net/gh/clappr/dash-shaka-playback@latest/dist/dash-shaka-playback.js",
        "https://cdn.jsdelivr.net/gh/clappr/clappr-level-selector-plugin@latest/dist/level-selector.min.js"
   
    ], function() {
        var b = getType(a);
        var current_clappr = new Clappr.Player({
            source: a,
            maxBufferLength: 30,
            hlsjsConfig: { maxBufferLength: 30 },
            playback: { debug: true },
            disableVideoTagContextMenu: false,
            parentId: "#player",
            preload: "auto",
            autoPlay: true, 
            plugins: [LevelSelector, Clappr.HLS, DashShakaPlayback],
            mimeType: b,
            language: "pt-en",
            mediacontrol: {
                seekbar: "#00f5ff",
                buttons: "#00f5ff"
            },
            width: "100%",
            height: "100%",
            events: {
                onError: function(d) {
                    // Error(a)
                }
            }
        });
        setTimeout(function() {
            current_clappr.play();
        }, 3000);
    });
      document.title = "elahmad.ru: " +a;
}



playWithClappr(window.location.href.split("#")[1], window.location.href.split("=")[1])
</script>
</body>
</html>
